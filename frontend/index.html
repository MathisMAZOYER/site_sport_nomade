<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gym Tracker</title>

<style>
:root {
  --bg: #0b0d10;
  --bg-soft: #11151a;
  --card: #151a20;
  --card-hover: #1b2128;
  --border: #252c34;
  --text: #f4f6f8;
  --muted: #8d98a5;
  --accent: #5eead4;
  --accent-strong: #2dd4bf;
  --danger: #fb7185;
  --warning: #fbbf24;
  --shadow: 0 12px 35px rgba(0,0,0,.25);
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

html {
  color-scheme: dark;
}

body {
  margin: 0;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(circle at top right, rgba(45,212,191,.08), transparent 35%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* =========================
   TOPBAR
========================= */

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: rgba(11,13,16,.88);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.5px;
}

.logo-icon {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  background: var(--accent);
  color: #071311;
  border-radius: 11px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-buttons {
  display: flex;
  gap: 6px;
}

.user-button {
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  padding: 8px 13px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  transition: .2s;
}

.user-button:hover {
  background: var(--card);
  color: var(--text);
}

.user-button.active {
  background: rgba(94,234,212,.12);
  border-color: rgba(94,234,212,.25);
  color: var(--accent);
}

/* =========================
   LAYOUT
========================= */

.app {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  min-height: calc(100vh - 70px);
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  border-right: 1px solid var(--border);
  background: rgba(17,21,26,.65);
  padding: 24px 18px;
}

.sidebar-title {
  color: var(--muted);
  text-transform: uppercase;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  margin: 4px 10px 12px;
}

.new-session-btn {
  width: 100%;
  margin-bottom: 25px;
}

.session-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.session-item {
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text);
  padding: 13px 12px;
  border-radius: 12px;
  cursor: pointer;
  transition: .2s;
}

.session-item:hover {
  background: var(--card);
}

.session-item.active {
  background: rgba(94,234,212,.09);
  border-color: rgba(94,234,212,.2);
}

.session-item-name {
  display: block;
  font-size: 14px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-item-date {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
}

/* =========================
   MAIN
========================= */

.main {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 34px;
}

.empty-state {
  min-height: 65vh;
  display: grid;
  place-items: center;
  text-align: center;
  color: var(--muted);
}

.empty-icon {
  width: 70px;
  height: 70px;
  margin: auto auto 18px;
  border-radius: 22px;
  background: var(--card);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  font-size: 32px;
}

/* =========================
   SESSION HEADER
========================= */

.session-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 26px;
}

.session-title {
  margin: 0;
  font-size: clamp(26px, 4vw, 38px);
  letter-spacing: -1.2px;
}

.session-date {
  color: var(--muted);
  margin-top: 7px;
  font-size: 14px;
}

.header-actions {
  display: flex;
  gap: 8px;
}

/* =========================
   BUTTONS
========================= */

button {
  font-family: inherit;
}

.btn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 11px;
  cursor: pointer;
  font-weight: 700;
  transition: .2s;
}

.btn:hover {
  background: var(--card-hover);
  transform: translateY(-1px);
}

.btn-primary {
  border-color: transparent;
  background: var(--accent);
  color: #071311;
}

.btn-primary:hover {
  background: var(--accent-strong);
}

.btn-danger {
  color: var(--danger);
}

.btn-small {
  padding: 7px 9px;
  font-size: 12px;
}

/* =========================
   STATS
========================= */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 28px;
}

.stat-card {
  padding: 20px;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.stat-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .7px;
}

.stat-value {
  margin-top: 7px;
  font-size: 27px;
  font-weight: 800;
}

/* =========================
   ADD PERFORMANCE
========================= */

.add-card {
  margin-bottom: 28px;
  padding: 20px;
  border: 1px solid var(--border);
  background: linear-gradient(
    145deg,
    rgba(94,234,212,.06),
    var(--card)
  );
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.card-title {
  margin: 0 0 17px;
  font-size: 16px;
}

.form-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: end;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}

input,
select {
  width: 100%;
  height: 43px;
  border: 1px solid var(--border);
  background: #0d1115;
  color: var(--text);
  border-radius: 10px;
  padding: 0 12px;
  outline: none;
  font: inherit;
}

input:focus,
select:focus {
  border-color: rgba(94,234,212,.65);
  box-shadow: 0 0 0 3px rgba(94,234,212,.08);
}

/* =========================
   EXERCISES
========================= */

.exercise-section {
  margin-bottom: 28px;
}

.exercise-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 14px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.exercise-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 17px 18px;
  border-bottom: 1px solid var(--border);
}

.exercise-name {
  font-size: 16px;
  font-weight: 800;
}

.exercise-count {
  color: var(--muted);
  font-size: 12px;
}

.exercise-actions {
  display: flex;
  gap: 6px;
}

/* =========================
   SET ROW
========================= */

.set-row {
  display: grid;
  grid-template-columns: 48px 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 12px 18px;
  border-bottom: 1px solid rgba(37,44,52,.6);
}

.set-row:last-child {
  border-bottom: none;
}

.set-number {
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.set-value {
  color: var(--text);
  font-size: 14px;
}

.set-value strong {
  font-weight: 800;
}

.set-unit {
  color: var(--muted);
  font-size: 11px;
  margin-left: 3px;
}

.set-actions {
  display: flex;
  gap: 5px;
}

.icon-btn {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: .2s;
}

.icon-btn:hover {
  color: var(--text);
  background: var(--card-hover);
}

.icon-btn.delete:hover {
  color: var(--danger);
  border-color: rgba(251,113,133,.3);
}

/* =========================
   MODAL
========================= */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(0,0,0,.7);
  backdrop-filter: blur(7px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-backdrop.visible {
  display: flex;
}

.modal {
  width: min(500px, 100%);
  background: #151a20;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
}

.modal h2 {
  margin-top: 0;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

/* =========================
   TOAST
========================= */

.toast-container {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  min-width: 240px;
  padding: 13px 16px;
  border-radius: 12px;
  background: #171d23;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  font-size: 13px;
  animation: toastIn .2s ease-out;
}

.toast.success {
  border-color: rgba(94,234,212,.35);
}

.toast.error {
  border-color: rgba(251,113,133,.35);
}

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================
   LOADING
========================= */

.loading {
  opacity: .5;
  pointer-events: none;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 850px) {

  .topbar {
    padding: 0 15px;
  }

  .logo-text {
    display: none;
  }

  .app {
    display: block;
  }

  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 12px;
  }

  .sidebar-title {
    display: none;
  }

  .new-session-btn {
    margin-bottom: 10px;
  }

  .session-list {
    flex-direction: row;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .session-item {
    min-width: 180px;
  }

  .main {
    padding: 20px 14px 100px;
  }

  .session-header {
    flex-direction: column;
  }

  .header-actions {
    width: 100%;
  }

  .header-actions button {
    flex: 1;
  }

  .stats {
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .stat-card {
    padding: 14px 10px;
  }

  .stat-value {
    font-size: 20px;
  }

  .form-grid {
    grid-template-columns: 1fr 1fr;
  }

  .form-grid .field:first-child {
    grid-column: 1 / -1;
  }

  .form-grid button {
    grid-column: 1 / -1;
  }

  .set-row {
    grid-template-columns: 32px 1fr 1fr 1fr;
    gap: 5px;
    padding: 12px;
  }

  .set-actions {
    grid-column: 2 / -1;
  }

  .user-buttons {
    max-width: 50vw;
    overflow-x: auto;
  }
}

@media (max-width: 500px) {

  .stats {
    grid-template-columns: 1fr 1fr 1fr;
  }

  .stat-label {
    font-size: 9px;
  }

  .set-row {
    grid-template-columns: 30px 1fr 1fr;
  }

  .set-row .weight-cell {
    grid-column: 2 / 3;
  }

  .set-actions {
    grid-column: 3;
    grid-row: 1 / span 2;
    flex-direction: column;
  }
}
</style>
</head>

<body>

<!-- =========================
     TOP BAR
========================= -->

<header class="topbar">

  <div class="logo">
    <div class="logo-icon">🏋️</div>
    <span class="logo-text">Gym Tracker</span>
  </div>

  <div class="topbar-right">
    <div id="users" class="user-buttons"></div>
  </div>

</header>


<!-- =========================
     APPLICATION
========================= -->

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <button
      class="btn btn-primary new-session-btn"
      onclick="createSession()"
    >
      ＋ Nouvelle session
    </button>

    <div class="sidebar-title">
      Mes sessions
    </div>

    <div id="sessionList" class="session-list"></div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <div id="emptyState" class="empty-state">

      <div>
        <div class="empty-icon">🏋️</div>

        <h2>Aucune session sélectionnée</h2>

        <p>
          Sélectionne une session ou crée-en une nouvelle
          pour commencer ton entraînement.
        </p>

        <button
          class="btn btn-primary"
          onclick="createSession()"
        >
          ＋ Commencer une session
        </button>
      </div>

    </div>


    <div id="sessionContent" style="display:none;">

      <!-- SESSION HEADER -->

      <section class="session-header">

        <div>
          <h1 id="sessionTitle" class="session-title">
            Session
          </h1>

          <div id="sessionDate" class="session-date"></div>
        </div>

        <div class="header-actions">

          <button
            class="btn"
            onclick="renameSession()"
          >
            ✏️ Renommer
          </button>

          <button
            class="btn btn-danger"
            onclick="deleteSession()"
          >
            🗑️ Supprimer
          </button>

        </div>

      </section>


      <!-- STATS -->

      <section class="stats">

        <div class="stat-card">
          <div class="stat-label">
            Exercices
          </div>

          <div id="statExercises" class="stat-value">
            0
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-label">
            Séries
          </div>

          <div id="statSets" class="stat-value">
            0
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-label">
            Volume
          </div>

          <div id="statVolume" class="stat-value">
            0 kg
          </div>
        </div>

      </section>


      <!-- ADD PERFORMANCE -->

      <section class="add-card">

        <h2 class="card-title">
          ＋ Ajouter une performance
        </h2>

        <div class="form-grid">

          <div class="field">

            <label>
              Exercice
            </label>

            <select id="exerciseSelect"></select>

          </div>


          <div class="field">

            <label>
              Séries
            </label>

            <input
              id="series"
              type="number"
              min="1"
              value="3"
            >

          </div>


          <div class="field">

            <label>
              Reps
            </label>

            <input
              id="reps"
              type="number"
              min="1"
              placeholder="12"
            >

          </div>


          <div class="field">

            <label>
              Poids
            </label>

            <input
              id="weight"
              type="number"
              min="0"
              step="0.5"
              placeholder="60"
            >

          </div>


          <button
            class="btn btn-primary"
            onclick="addSet()"
          >
            Ajouter
          </button>

        </div>

      </section>


      <!-- EXERCISES -->

      <section class="exercise-section">

        <div
          id="recap"
        ></div>

      </section>

    </div>

  </main>

</div>


<!-- =========================
     MODAL
========================= -->

<div
  id="modalBackdrop"
  class="modal-backdrop"
  onclick="closeModalOnBackdrop(event)"
>

  <div class="modal">

    <h2 id="modalTitle">
      Modifier
    </h2>

    <div id="modalBody"></div>

    <div class="modal-actions">

      <button
        class="btn"
        onclick="closeModal()"
      >
        Annuler
      </button>

      <button
        id="modalConfirm"
        class="btn btn-primary"
      >
        Enregistrer
      </button>

    </div>

  </div>

</div>


<!-- TOASTS -->

<div
  id="toastContainer"
  class="toast-container"
></div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API = "https://api.sport.nomade.one";


/* =========================================================
   STATE
========================================================= */

let users = [];
let exercises = [];

let currentUser = null;
let currentSession = null;
let currentSets = [];


/* =========================================================
   UTILITIES
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function formatDate(dateString) {

  if (!dateString) return "";

  const date = new Date(dateString);

  return date.toLocaleDateString("fr-FR", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });

}


function formatShortDate(dateString) {

  if (!dateString) return "";

  const date = new Date(dateString);

  return date.toLocaleDateString("fr-FR", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });

}


function showToast(message, type = "success") {

  const container =
    document.getElementById("toastContainer");

  const toast =
    document.createElement("div");

  toast.className = `toast ${type}`;

  toast.textContent = message;

  container.appendChild(toast);

  setTimeout(() => {
    toast.remove();
  }, 3000);

}


function setLoading(element, loading) {

  if (!element) return;

  element.classList.toggle("loading", loading);

}


/* =========================================================
   MODAL
========================================================= */

function openModal(title, bodyHtml, confirmCallback) {

  document.getElementById("modalTitle").textContent = title;

  document.getElementById("modalBody").innerHTML = bodyHtml;

  document.getElementById("modalConfirm").onclick =
    async () => {

      await confirmCallback();

    };

  document
    .getElementById("modalBackdrop")
    .classList.add("visible");

}


function closeModal() {

  document
    .getElementById("modalBackdrop")
    .classList.remove("visible");

}


function closeModalOnBackdrop(event) {

  if (event.target.id === "modalBackdrop") {
    closeModal();
  }

}


/* =========================================================
   USERS
========================================================= */

async function loadUsers() {

  try {

    const res =
      await fetch(API + "/users");

    if (!res.ok) {
      throw new Error("Impossible de charger les utilisateurs");
    }

    users = await res.json();

    renderUsers();

    /*
     * Si aucun utilisateur n'est sélectionné,
     * on prend le premier.
     */
    if (!currentUser && users.length) {

      currentUser = users[0];

      renderUsers();

      await loadSessions();

    }

  } catch (err) {

    console.error(err);

    showToast(
      "Impossible de charger les utilisateurs",
      "error"
    );

  }

}


function renderUsers() {

  const container =
    document.getElementById("users");

  container.innerHTML = "";

  users.forEach(user => {

    const button =
      document.createElement("button");

    button.className =
      "user-button" +
      (
        currentUser &&
        currentUser.id === user.id
          ? " active"
          : ""
      );

    button.textContent = user.name;

    button.onclick = async () => {

      currentUser = user;

      currentSession = null;

      renderUsers();

      await loadSessions();

    };

    container.appendChild(button);

  });

}


/* =========================================================
   SESSIONS
========================================================= */

async function loadSessions() {

  if (!currentUser) return;

  try {

    const res =
      await fetch(API + "/sessions");

    if (!res.ok) {
      throw new Error("Erreur sessions");
    }

    const sessions =
      await res.json();

    const userSessions =
      sessions.filter(
        session =>
          Number(session.user_id) ===
          Number(currentUser.id)
      );

    renderSessionList(userSessions);

    /*
     * Si la session actuelle existe encore,
     * on la garde.
     */
    if (currentSession) {

      const stillExists =
        userSessions.find(
          s =>
            Number(s.id) ===
            Number(currentSession.id)
        );

      if (stillExists) {

        currentSession = stillExists;

        await loadRecap();

        return;

      }

    }

    /*
     * Sinon on ouvre la session la plus récente.
     */
    if (userSessions.length) {

      currentSession = userSessions[0];

      await loadRecap();

    } else {

      currentSession = null;

      showEmptyState();

    }

  } catch (err) {

    console.error(err);

    showToast(
      "Impossible de charger les sessions",
      "error"
    );

  }

}


function renderSessionList(sessions) {

  const container =
    document.getElementById("sessionList");

  container.innerHTML = "";

  if (!sessions.length) {

    container.innerHTML = `
      <div style="
        color:var(--muted);
        font-size:12px;
        padding:10px;
      ">
        Aucune session
      </div>
    `;

    return;

  }

  sessions.forEach(session => {

    const button =
      document.createElement("button");

    button.className =
      "session-item" +
      (
        currentSession &&
        Number(currentSession.id) === Number(session.id)
          ? " active"
          : ""
      );

    button.innerHTML = `
      <span class="session-item-name">
        ${escapeHtml(session.name)}
      </span>

      <span class="session-item-date">
        ${formatShortDate(session.created_at)}
      </span>
    `;

    button.onclick = async () => {

      currentSession = session;

      renderSessionList(sessions);

      await loadRecap();

    };

    container.appendChild(button);

  });

}


/* =========================================================
   CREATE SESSION
========================================================= */

async function createSession() {

  if (!currentUser) {

    showToast(
      "Sélectionne d'abord un utilisateur",
      "error"
    );

    return;

  }

  try {

    const res =
      await fetch(API + "/sessions", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          name:
            "Session " +
            new Date().toLocaleString("fr-FR"),

          user_id:
            currentUser.id

        })

      });

    if (!res.ok) {
      throw new Error("Création impossible");
    }

    const session =
      await res.json();

    /*
     * La nouvelle session devient
     * immédiatement la session courante.
     */
    currentSession = session;

    showToast("Session créée");

    await loadSessions();

    /*
     * Sécurité : on force la session créée.
     */
    currentSession = session;

    await loadRecap();

  } catch (err) {

    console.error(err);

    showToast(
      "Impossible de créer la session",
      "error"
    );

  }

}


/* =========================================================
   RENAME SESSION
========================================================= */

function renameSession() {

  if (!currentSession) return;

  openModal(
    "Renommer la session",

    `
      <div class="field">
        <label>Nom</label>

        <input
          id="renameInput"
          value="${escapeHtml(currentSession.name)}"
          autofocus
        >
      </div>
    `,

    async () => {

      const name =
        document
          .getElementById("renameInput")
          .value
          .trim();

      if (!name) {

        showToast(
          "Le nom est requis",
          "error"
        );

        return;

      }

      try {

        const res =
          await fetch(
            API + `/sessions/${currentSession.id}`,
            {
              method: "PUT",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({

                name,

                user_id:
                  currentUser.id

              })

            }
          );

        if (!res.ok) {
          throw new Error();
        }

        const session =
          await res.json();

        currentSession = session;

        closeModal();

        await loadSessions();

        showToast("Session renommée");

      } catch (err) {

        console.error(err);

        showToast(
          "Impossible de renommer la session",
          "error"
        );

      }

    }

  );

}


/* =========================================================
   DELETE SESSION
========================================================= */

async function deleteSession() {

  if (!currentSession) return;

  const confirmed =
    confirm(
      "Supprimer cette session et toutes ses performances ?"
    );

  if (!confirmed) return;

  try {

    const res =
      await fetch(
        API + `/sessions/${currentSession.id}`,
        {
          method: "DELETE"
        }
      );

    if (!res.ok) {
      throw new Error();
    }

    currentSession = null;

    currentSets = [];

    showToast("Session supprimée");

    await loadSessions();

  } catch (err) {

    console.error(err);

    showToast(
      "Impossible de supprimer la session",
      "error"
    );

  }

}


/* =========================================================
   EXERCISES
========================================================= */

async function loadExercises() {

  try {

    const res =
      await fetch(API + "/exercises");

    if (!res.ok) {
      throw new Error();
    }

    exercises =
      await res.json();

    renderExerciseSelect();

  } catch (err) {

    console.error(err);

    showToast(
      "Impossible de charger les exercices",
      "error"
    );

  }

}


function renderExerciseSelect() {

  const select =
    document.getElementById("exerciseSelect");

  select.innerHTML = "";

  if (!exercises.length) {

    select.innerHTML = `
      <option value="">
        Aucun exercice
      </option>
    `;

    return;

  }

  exercises.forEach(exercise => {

    const option =
      document.createElement("option");

    option.value =
      exercise.id;

    option.textContent =
      exercise.name;

    select.appendChild(option);

  });

}


/* =========================================================
   ADD SET
========================================================= */

async function addSet() {

  if (!currentUser || !currentSession) {

    showToast(
      "Sélectionne une session",
      "error"
    );

    return;

  }

  const exercise_id =
    parseInt(
      document.getElementById("exerciseSelect").value
    );

  const series =
    parseInt(
      document.getElementById("series").value
    );

  const reps =
    parseInt(
      document.getElementById("reps").value
    );

  const weight =
    parseFloat(
      document.getElementById("weight").value
    );

  if (
    isNaN(exercise_id) ||
    isNaN(series) ||
    series < 1 ||
    isNaN(reps) ||
    reps < 1 ||
    isNaN(weight) ||
    weight < 0
  ) {

    showToast(
      "Vérifie les valeurs saisies",
      "error"
    );

    return;

  }

  try {

    const res =
      await fetch(API + "/sets", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          user_id:
            currentUser.id,

          session_id:
            currentSession.id,

          exercise_id,

          series,

          reps,

          weight

        })

      });

    if (!res.ok) {
      throw new Error();
    }

    /*
     * Reset reps/weight mais conserve
     * le nombre de séries.
     */
    document.getElementById("reps").value = "";
    document.getElementById("weight").value = "";

    await loadRecap();

    showToast("Performance ajoutée");

  } catch (err) {

    console.error(err);

    showToast(
      "Impossible d'ajouter la performance",
      "error"
    );

  }

}


/* =========================================================
   LOAD RECAP
========================================================= */

async function loadRecap() {

  if (!currentSession) {

    showEmptyState();

    return;

  }

  try {

    const res =
      await fetch(
        API + `/sessions/${currentSession.id}/sets`
      );

    if (!res.ok) {
      throw new Error();
    }

    currentSets =
      await res.json();

    renderSession();

  } catch (err) {

    console.error(err);

    showToast(
      "Impossible de charger les performances",
      "error"
    );

  }

}


/* =========================================================
   RENDER SESSION
========================================================= */

function renderSession() {

  if (!currentSession) {

    showEmptyState();

    return;

  }

  document
    .getElementById("emptyState")
    .style.display = "none";

  document
    .getElementById("sessionContent")
    .style.display = "block";


  document
    .getElementById("sessionTitle")
    .textContent =
      currentSession.name;


  document
    .getElementById("sessionDate")
    .textContent =
      formatDate(currentSession.created_at);


  renderStats();

  renderRecap();

}


function showEmptyState() {

  document
    .getElementById("emptyState")
    .style.display = "grid";

  document
    .getElementById("sessionContent")
    .style.display = "none";

}


/* =========================================================
   STATS
========================================================= */

function renderStats() {

  const exerciseIds =
    new Set(
      currentSets.map(
        set => set.exercise_id
      )
    );

  const numberOfExercises =
    exerciseIds.size;

  const numberOfSets =
    currentSets.reduce(
      (total, set) =>
        total + Number(set.series || 1),
      0
    );

  const volume =
    currentSets.reduce(
      (total, set) =>
        total +
        (
          Number(set.series || 1) *
          Number(set.reps || 0) *
          Number(set.weight || 0)
        ),
      0
    );

  document
    .getElementById("statExercises")
    .textContent =
      numberOfExercises;

  document
    .getElementById("statSets")
    .textContent =
      numberOfSets;

  document
    .getElementById("statVolume")
    .textContent =
      `${volume.toLocaleString("fr-FR")} kg`;

}


/* =========================================================
   RECAP
========================================================= */

function renderRecap() {

  const recap =
    document.getElementById("recap");

  recap.innerHTML = "";

  if (!currentSets.length) {

    recap.innerHTML = `
      <div class="empty-state" style="min-height:300px;">
        <div>
          <div class="empty-icon">💪</div>

          <h2>Aucune performance</h2>

          <p>
            Ajoute ton premier exercice ci-dessus.
          </p>
        </div>
      </div>
    `;

    return;

  }


  /*
   * Regroupement par exercice.
   */
  const grouped = {};

  currentSets.forEach(set => {

    const key =
      set.exercise_id;

    if (!grouped[key]) {
      grouped[key] = [];
    }

    grouped[key].push(set);

  });


  Object.values(grouped).forEach(sets => {

    const first =
      sets[0];

    const exerciseName =
      first.exercise_name ||
      getExerciseName(first.exercise_id);


    const card =
      document.createElement("div");

    card.className =
      "exercise-card";


    const header =
      document.createElement("div");

    header.className =
      "exercise-header";


    header.innerHTML = `

      <div>

        <div class="exercise-name">
          ${escapeHtml(exerciseName)}
        </div>

        <div class="exercise-count">
          ${sets.length}
          ${sets.length > 1 ? "performances" : "performance"}
        </div>

      </div>

      <div class="exercise-actions">

        <button
          class="icon-btn"
          title="Supprimer l'exercice de la session"
          onclick="deleteExerciseFromSession(${first.exercise_id})"
        >
          🗑️
        </button>

      </div>

    `;

    card.appendChild(header);


    sets.forEach((set, index) => {

      const row =
        document.createElement("div");

      row.className =
        "set-row";


      row.innerHTML = `

        <div class="set-number">
          #${index + 1}
        </div>

        <div class="set-value">
          <strong>${set.series}</strong>
          <span class="set-unit">séries</span>
        </div>

        <div class="set-value">
          <strong>${set.reps}</strong>
          <span class="set-unit">reps</span>
        </div>

        <div class="set-value weight-cell">
          <strong>${set.weight}</strong>
          <span class="set-unit">kg</span>
        </div>

        <div class="set-actions">

          <button
            class="icon-btn"
            title="Modifier"
            onclick="editSet(${set.id})"
          >
            ✏️
          </button>

          <button
            class="icon-btn delete"
            title="Supprimer"
            onclick="deleteSet(${set.id})"
          >
            🗑️
          </button>

        </div>

      `;

      card.appendChild(row);

    });


    recap.appendChild(card);

  });

}


/* =========================================================
   GET EXERCISE NAME
========================================================= */

function getExerciseName(id) {

  const exercise =
    exercises.find(
      e =>
        Number(e.id) ===
        Number(id)
    );

  return exercise
    ? exercise.name
    : `Exercice ${id}`;

}


/* =========================================================
   EDIT SET
========================================================= */

function editSet(id) {

  const set =
    currentSets.find(
      s =>
        Number(s.id) ===
        Number(id)
    );

  if (!set) return;


  openModal(

    "Modifier la performance",

    `

      <div
        style="
          display:grid;
          grid-template-columns:1fr 1fr 1fr;
          gap:10px;
        "
      >

        <div class="field">

          <label>Séries</label>

          <input
            id="editSeries"
            type="number"
            min="1"
            value="${set.series}"
          >

        </div>

        <div class="field">

          <label>Reps</label>

          <input
            id="editReps"
            type="number"
            min="1"
            value="${set.reps}"
          >

        </div>

        <div class="field">

          <label>Poids</label>

          <input
            id="editWeight"
            type="number"
            min="0"
            step="0.5"
            value="${set.weight}"
          >

        </div>

      </div>

    `,

    async () => {

      const series =
        parseInt(
          document.getElementById("editSeries").value
        );

      const reps =
        parseInt(
          document.getElementById("editReps").value
        );

      const weight =
        parseFloat(
          document.getElementById("editWeight").value
        );


      if (
        isNaN(series) ||
        series < 1 ||
        isNaN(reps) ||
        reps < 1 ||
        isNaN(weight) ||
        weight < 0
      ) {

        showToast(
          "Valeurs invalides",
          "error"
        );

        return;

      }


      try {

        const res =
          await fetch(
            API + `/sets/${id}`,
            {

              method: "PUT",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                series,
                reps,
                weight
              })

            }
          );


        if (!res.ok) {
          throw new Error();
        }


        closeModal();

        await loadRecap();

        showToast("Performance modifiée");

      } catch (err) {

        console.error(err);

        showToast(
          "Impossible de modifier la performance",
          "error"
        );

      }

    }

  );

}


/* =========================================================
   DELETE SET
========================================================= */

async function deleteSet(id) {

  if (
    !confirm(
      "Supprimer cette performance ?"
    )
  ) return;


  try {

    const res =
      await fetch(
        API + `/sets/${id}`,
        {
          method: "DELETE"
        }
      );


    if (!res.ok) {
      throw new Error();
    }


    await loadRecap();

    showToast("Performance supprimée");

  } catch (err) {

    console.error(err);

    showToast(
      "Impossible de supprimer la performance",
      "error"
    );

  }

}


/* =========================================================
   DELETE EXERCISE FROM SESSION
========================================================= */

async function deleteExerciseFromSession(exerciseId) {

  const sets =
    currentSets.filter(
      set =>
        Number(set.exercise_id) ===
        Number(exerciseId)
    );


  if (!sets.length) return;


  const exerciseName =
    sets[0].exercise_name ||
    getExerciseName(exerciseId);


  if (
    !confirm(
      `Supprimer "${exerciseName}" et ses ${sets.length} performances de cette session ?`
    )
  ) return;


  try {

    /*
     * Le backend ne possède pas encore
     * DELETE /sessions/:sessionId/exercises/:exerciseId.
     *
     * On supprime donc chaque performance
     * individuellement avec DELETE /sets/:id.
     */
    await Promise.all(

      sets.map(
        set =>
          fetch(
            API + `/sets/${set.id}`,
            {
              method: "DELETE"
            }
          )
      )

    );


    await loadRecap();

    showToast(
      `${exerciseName} supprimé de la session`
    );


  } catch (err) {

    console.error(err);

    showToast(
      "Impossible de supprimer l'exercice",
      "error"
    );

  }

}


/* =========================================================
   INIT
========================================================= */

async function init() {

  try {

    await Promise.all([
      loadExercises(),
      loadUsers()
    ]);

  } catch (err) {

    console.error(err);

  }

}


window.addEventListener(
  "load",
  init
);

</script>
